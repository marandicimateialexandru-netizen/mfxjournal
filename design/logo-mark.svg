<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="30" x2="472" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="52%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="pageL" x1="130" y1="130" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pageR" x1="382" y1="130" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="winCandle" x1="304" y1="185" x2="304" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- Open journal: two pages fanning from a center spine, seen from slightly above -->
  <path d="M256,168 C 214,142 168,130 132,127 C 120,126 111,135 111,147 L111,338 C 111,349 120,357 132,358 C 168,361 214,372 256,396 Z" fill="url(#pageL)"/>
  <path d="M256,168 C 298,142 344,130 380,127 C 392,126 401,135 401,147 L401,338 C 401,349 392,357 380,358 C 344,361 298,372 256,396 Z" fill="url(#pageR)"/>

  <!-- Spine shadow -->
  <path d="M256,168 L256,396" stroke="#4c1d95" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round"/>

  <!-- Page rule lines (a few strokes suggesting journal writing lines) -->
  <path d="M138,180 L214,196" stroke="#c4b5fd" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
  <path d="M136,210 L212,224" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <path d="M298,196 L374,180" stroke="#c4b5fd" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round"/>
  <path d="M300,224 L376,210" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>

  <!-- Candlesticks drawn across the open pages, ascending left to right -->
  <line x1="196" y1="248" x2="196" y2="322" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
  <rect x="182" y="264" width="28" height="46" rx="6" fill="#7c3aed" fill-opacity="0.55"/>

  <line x1="256" y1="210" x2="256" y2="330" stroke="#6d28d9" stroke-width="10" stroke-linecap="round"/>
  <rect x="240" y="232" width="32" height="76" rx="7" fill="#6d28d9"/>

  <line x1="316" y1="168" x2="316" y2="316" stroke="#34d399" stroke-width="11" stroke-linecap="round"/>
  <rect x="298" y="185" width="36" height="115" rx="8" fill="url(#winCandle)"/>
</svg>
